[project]
name = "jev-laya-lab"
version = "0.1.0"
description = "Educational lab: compare Jev, Laya, and Laya-MLX on the same typed game decisions"
requires-python = ">=3.11"
dependencies = ["laya>=0.4,<0.5", "laya-mlx>=0.4,<0.5"]

[dependency-groups]
# Screen capture and keyboard/mouse input for games/ cases (kbm_agent.py).
kbm = ["pillow>=10", "pyobjc-framework-Quartz>=10"]

[tool.uv]
package = false
default-groups = ["kbm"]
